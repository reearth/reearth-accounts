
"""
Marks a Query or Mutation field as callable without a token. Every other field
requires authentication. The auth middleware reads this directive at startup.
"""
directive @public on FIELD_DEFINITION

interface Node {
  id: ID!
}

enum NodeType {
  USER
  WORKSPACE
}

# Basic types
scalar DateTime
scalar Lang
scalar Upload

enum Theme {
  DEFAULT
  LIGHT
  DARK
}

type Query {
  node(id: ID!, type: NodeType!): Node
  nodes(id: [ID!]!, type: NodeType!): [Node]
}

type Mutation

schema {
  query: Query
  mutation: Mutation
}