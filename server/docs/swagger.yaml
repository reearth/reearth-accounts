basePath: /
definitions:
  httpmodel.AddIntegrationRequest:
    properties:
      integration_id:
        type: string
      role:
        enum:
        - reader
        - writer
        - maintainer
        - owner
        type: string
    required:
    - integration_id
    - role
    type: object
  httpmodel.AddMembersRequest:
    properties:
      users:
        items:
          $ref: '#/definitions/httpmodel.MemberInputRequest'
        minItems: 1
        type: array
    required:
    - users
    type: object
  httpmodel.AuthConfigResponse:
    properties:
      auth_provider:
        type: string
      auth0_audience:
        type: string
      auth0_client_id:
        type: string
      auth0_domain:
        type: string
    type: object
  httpmodel.CheckPermissionRequest:
    properties:
      action:
        type: string
      resource:
        type: string
      service:
        type: string
      workspace_alias:
        type: string
    required:
    - action
    - resource
    - service
    type: object
  httpmodel.CheckPermissionResponse:
    properties:
      allowed:
        type: boolean
    type: object
  httpmodel.CreateVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  httpmodel.CreateWorkspaceRequest:
    properties:
      alias:
        type: string
      description:
        type: string
      name:
        type: string
      skip_owner_membership:
        description: |-
          SkipOwnerMembership, if true, creates the workspace without joining the
          caller as owner (for callers that manage membership themselves, e.g.
          LINKS-Veda). Defaults to false, preserving the normal create-and-own flow.
          REST-only; not exposed via GraphQL.
        type: boolean
    required:
    - alias
    - name
    type: object
  httpmodel.FindOrCreateRequest:
    properties:
      iss:
        type: string
      sub:
        type: string
      token:
        type: string
    required:
    - iss
    - sub
    - token
    type: object
  httpmodel.MFAEnrollResponse:
    properties:
      enrollment_url:
        type: string
    type: object
  httpmodel.MFARecoveryCodeResponse:
    properties:
      recovery_code:
        type: string
    type: object
  httpmodel.MFAStatusResponse:
    properties:
      enrolled:
        type: boolean
    type: object
  httpmodel.MeResponse:
    properties:
      alias:
        type: string
      auths:
        items:
          type: string
        type: array
      email:
        type: string
      host:
        type: string
      id:
        type: string
      latest_logout_at:
        type: string
      metadata:
        $ref: '#/definitions/httpmodel.UserMetadataResponse'
      my_workspace:
        allOf:
        - $ref: '#/definitions/httpmodel.WorkspaceResponse'
        description: |-
          MyWorkspace is set only with ?expand=my_workspace. It stays absent when
          the personal workspace no longer exists, rather than failing the request.
      my_workspace_id:
        type: string
      name:
        type: string
    type: object
  httpmodel.MemberInputRequest:
    properties:
      role:
        enum:
        - reader
        - writer
        - maintainer
        - owner
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  httpmodel.MemberUserResponse:
    properties:
      alias:
        type: string
      auths:
        items:
          type: string
        type: array
      email:
        description: |-
          Email is empty unless the caller is this user. Signup, verification,
          maintainer-only routes and sync-sso called with its API key include it.
        type: string
      host:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/httpmodel.UserMetadataResponse'
      name:
        type: string
      verification:
        $ref: '#/definitions/httpmodel.VerificationResponse'
      workspace:
        type: string
    type: object
  httpmodel.MessageResponse:
    properties:
      success:
        type: boolean
    type: object
  httpmodel.PasswordResetRequest:
    properties:
      password:
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  httpmodel.RemoveIntegrationsRequest:
    properties:
      integration_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - integration_ids
    type: object
  httpmodel.RemoveMembersRequest:
    properties:
      user_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - user_ids
    type: object
  httpmodel.SetPlatformRolesBySubRequest:
    properties:
      role_names:
        items:
          type: string
        type: array
    type: object
  httpmodel.SignupOIDCRequest:
    properties:
      email:
        type: string
      id:
        type: string
      lang:
        type: string
      name:
        type: string
      secret:
        type: string
      sub:
        type: string
      workspace_id:
        type: string
    type: object
  httpmodel.SignupRequest:
    properties:
      email:
        type: string
      id:
        type: string
      lang:
        type: string
      mock_auth:
        type: boolean
      name:
        type: string
      password:
        type: string
      secret:
        type: string
      theme:
        enum:
        - default
        - dark
        - light
        type: string
      workspace_id:
        type: string
    required:
    - email
    - name
    - password
    type: object
  httpmodel.SimpleUserResponse:
    properties:
      email:
        description: Email is empty unless the caller is this user.
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  httpmodel.StartPasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  httpmodel.SyncSSOUserRequest:
    properties:
      email:
        type: string
      id:
        type: string
      lang:
        type: string
      name:
        type: string
      sub:
        type: string
      theme:
        enum:
        - default
        - dark
        - light
        type: string
      workspace_id:
        type: string
    required:
    - email
    - name
    - sub
    type: object
  httpmodel.TransferOwnershipRequest:
    properties:
      new_owner_id:
        type: string
    required:
    - new_owner_id
    type: object
  httpmodel.UpdateIntegrationRequest:
    properties:
      role:
        enum:
        - reader
        - writer
        - maintainer
        - owner
        type: string
    required:
    - role
    type: object
  httpmodel.UpdateMeRequest:
    properties:
      alias:
        type: string
      description:
        type: string
      email:
        type: string
      lang:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
      photo_url:
        type: string
      theme:
        enum:
        - default
        - dark
        - light
        type: string
      website:
        type: string
    type: object
  httpmodel.UpdateMemberRequest:
    properties:
      role:
        enum:
        - reader
        - writer
        - maintainer
        - owner
        type: string
    required:
    - role
    type: object
  httpmodel.UpdateUserBySubRequest:
    properties:
      name:
        type: string
    type: object
  httpmodel.UpdateWorkspaceRequest:
    properties:
      alias:
        type: string
      description:
        type: string
      name:
        type: string
      photo_url:
        type: string
      website:
        type: string
    type: object
  httpmodel.UserMetadataResponse:
    properties:
      description:
        type: string
      lang:
        type: string
      photo_url:
        description: |-
          A signed URL that expires on GET /api/users/me, so do not store it.
          Every other response carries the stored value.
        type: string
      theme:
        type: string
      website:
        type: string
    type: object
  httpmodel.UserResponse:
    properties:
      alias:
        type: string
      auths:
        items:
          type: string
        type: array
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        description: |-
          Email is empty unless the caller is this user. Signup, verification,
          maintainer-only routes and sync-sso called with its API key include it.
        type: string
      host:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      metadata:
        $ref: '#/definitions/httpmodel.UserMetadataResponse'
      name:
        type: string
      platform_roles:
        description: |-
          PlatformRoles and Workspaces are populated by GET /api/users/all and by
          GET /api/users/{id} when callers request their own record. Other endpoints
          leave them nil.
        items:
          type: string
        type: array
      verification:
        $ref: '#/definitions/httpmodel.VerificationResponse'
      workspace:
        type: string
      workspaces:
        items:
          $ref: '#/definitions/httpmodel.UserWorkspaceResponse'
        type: array
    type: object
  httpmodel.UserWorkspaceResponse:
    properties:
      alias:
        type: string
      name:
        type: string
      role:
        type: string
      workspace_id:
        type: string
    type: object
  httpmodel.VerificationResponse:
    properties:
      expiration:
        type: string
      verified:
        type: boolean
    type: object
  httpmodel.VerifyUserRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  httpmodel.WorkspaceMemberResponse:
    properties:
      integration_id:
        type: string
      role:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/httpmodel.MemberUserResponse'
        description: |-
          User is set only with ?expand=members.user. Its photo_url is the stored
          value, and a soft-deleted user appears like a live one, both as in GraphQL.
      user_id:
        type: string
    type: object
  httpmodel.WorkspaceMetadataResponse:
    properties:
      billing_email:
        type: string
      description:
        type: string
      location:
        type: string
      photo_url:
        description: A signed URL that expires, so do not store it.
        type: string
      website:
        type: string
    type: object
  httpmodel.WorkspaceResponse:
    properties:
      alias:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/httpmodel.WorkspaceMemberResponse'
        type: array
      metadata:
        $ref: '#/definitions/httpmodel.WorkspaceMetadataResponse'
      name:
        type: string
      personal:
        type: boolean
      scim_available:
        type: boolean
    type: object
  internal.ErrorResponse:
    properties:
      description:
        type: string
      field_errors:
        items:
          $ref: '#/definitions/internal.FieldErrorResponse'
        type: array
      message:
        type: string
      status:
        type: integer
    type: object
  internal.FieldErrorResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  internal.PageResult-httpmodel_UserResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/httpmodel.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.Pagination'
    type: object
  internal.PageResult-httpmodel_WorkspaceResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/httpmodel.WorkspaceResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.Pagination'
    type: object
  internal.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: REST mirror of the reearth-accounts GraphQL surface.
  title: reearth-accounts REST API
  version: "1.0"
paths:
  /api/auth/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.AuthConfigResponse'
      summary: Get public auth configuration
      tags:
      - Auth
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out the current user
      tags:
      - Auth
  /api/permissions/check:
    post:
      consumes:
      - application/json
      parameters:
      - description: service/resource/action
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpmodel.CheckPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.CheckPermissionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check a permission for the current user
      tags:
      - Permission
  /api/service/workspaces/{id}/members/{user_id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: user ID
        in: path
        name: user_id
        required: true
        type: string
      - description: new role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpmodel.UpdateMemberRequest'
      - description: 'comma-separated expansions; allowed: members.user'
        in: query
        name: expand
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.WorkspaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a member's role, bypassing the self-promotion guard
      tags:
      - Workspace
  /api/users:
    get:
      description: 'Default form returns an array of users. When page, page_size,
        or alias is supplied, a paginated object is returned instead: {"items": [user...],
        "pagination": {"page", "page_size", "total"}}.'
      parameters:
      - description: comma-separated user IDs
        in: query
        name: ids
        type: string
      - description: alias filter (requires pagination)
        in: query
        name: alias
        type: string
      - description: page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 50, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: array form; the paginated form returns an object wrapper (see
            description)
          schema:
            items:
              $ref: '#/definitions/httpmodel.UserResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List users by IDs (optionally paginated with alias filter)
      tags:
      - User
  /api/users/{id}:
    get:
      parameters:
      - description: user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user by ID
      tags:
      - User
  /api/users/{id}/deactivate:
    post:
      parameters:
      - description: user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft-delete a user (sets deleted_at; maintainer role required)
      tags:
      - User
  /api/users/{id}/restore:
    post:
      parameters:
      - description: user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore a soft-deleted user (clears deleted_at; maintainer role required)
      tags:
      - User
  /api/users/all:
    get:
      parameters:
      - description: keyword filter (matches name, alias, or email)
        in: query
        name: keyword
        type: string
      - description: active (default), deleted, or all
        in: query
        name: status
        type: string
      - description: page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 50, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.PageResult-httpmodel_UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users across all tenants (platform owner or maintainer role
        required)
      tags:
      - User
  /api/users/by-alias:
    get:
      parameters:
      - description: alias
        in: query
        name: alias
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Find a user by alias
      tags:
      - User
  /api/users/by-name-or-alias:
    get:
      parameters:
      - description: name or alias
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpmodel.UserResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Find users by name or alias
      tags:
      - User
  /api/users/by-name-or-email:
    get:
      parameters:
      - description: name or email
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.SimpleUserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Find a user by name or email
      tags:
      - User
  /api/users/by-sub/{sub}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Firebase auth sub
        in: path
        name: sub
        required: true
        type: string
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpmodel.UpdateUserBySubRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user's fields by Firebase sub (maintainer role required)
      tags:
      - User
  /api/users/by-sub/{sub}/platform-roles:
    put:
      consumes:
      - application/json
      parameters:
      - description: Firebase auth sub
        in: path
        name: sub
        required: true
        type: string
      - description: role names
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpmodel.SetPlatformRolesBySubRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace a user's global platform roles (maintainer role required)
      tags:
      - User
  /api/users/find-or-create:
    post:
      consumes:
      - application/json
      parameters:
      - description: sub, iss, token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpmodel.FindOrCreateRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content (stub mirroring the GraphQL findOrCreate resolver)
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      summary: Find or create a user (M2M or JWT)
      tags:
      - User
  /api/users/me:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete current user
      tags:
      - User
    get:
      parameters:
      - description: 'comma-separated expansions; allowed: my_workspace'
        in: query
        name: expand
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - User
    patch:
      consumes:
      - application/json
      parameters:
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpmodel.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - User
  /api/users/me/auths/{sub}:
    delete:
      parameters:
      - description: auth provider/sub
        in: path
        name: sub
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpmodel.MeResponse'
      security:
      - BearerAuth: []
      summary: Remove an auth provider from the current user
      tags:
      - User
  /api/users/me/mfa:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
