basePath: /api/v1
definitions:
  AdminUser:
    properties:
      approvedAt:
        type: string
      approvedBy:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      pictureUrl:
        type: string
      role:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  CreatePolicyNoticeRequest:
    properties:
      audience:
        enum:
        - all
        - owners
        example: all
        type: string
    required:
    - audience
    type: object
  CreatePolicyNoticeResponse:
    properties:
      created:
        type: boolean
      notice:
        $ref: '#/definitions/PolicyNotice'
    type: object
  ErrorResponse:
    properties:
      code:
        example: Bad Request
        type: string
      message:
        example: invalid request
        type: string
    type: object
  GoogleSignInRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  GoogleSignInResponse:
    properties:
      email:
        type: string
      name:
        type: string
      pictureUrl:
        type: string
      status:
        type: string
    type: object
  ListAdminUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
      page:
        type: integer
      perPage:
        type: integer
      totalCount:
        type: integer
    type: object
  ListPolicyNoticesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/PolicyNoticeStatus'
        type: array
    type: object
  ListUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/User'
        type: array
      page:
        type: integer
      perPage:
        type: integer
      totalCount:
        type: integer
    type: object
  ListWorkspacesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/Workspace'
        type: array
      page:
        type: integer
      perPage:
        type: integer
      totalCount:
        type: integer
    type: object
  MeResponse:
    properties:
      approvedAt:
        type: string
      approvedBy:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      pictureUrl:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  PolicyNotice:
    properties:
      audience:
        example: all
        type: string
      bump:
        example: major
        type: string
      createdAt:
        type: string
      fanoutDone:
        type: boolean
      id:
        type: string
      requestedBy:
        type: string
      type:
        example: tos
        type: string
      version:
        example: 2.0.0
        type: string
    type: object
  PolicyNoticeStatus:
    properties:
      counts:
        additionalProperties:
          type: integer
        type: object
      notice:
        $ref: '#/definitions/PolicyNotice'
    type: object
  SetAdminUserRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  TransferWorkspaceOwnerConflictResponse:
    properties:
      code:
        example: already_owner
        type: string
      message:
        example: target user is already the sole owner
        type: string
      newOwner:
        $ref: '#/definitions/WorkspaceMember'
    type: object
  TransferWorkspaceOwnerRequest:
    properties:
      newOwnerUserId:
        type: string
    required:
    - newOwnerUserId
    type: object
  TransferWorkspaceOwnerResponse:
    properties:
      demotedUserIds:
        items:
          type: string
        type: array
      newOwner:
        $ref: '#/definitions/WorkspaceMember'
      workspace:
        $ref: '#/definitions/TransferredWorkspace'
    type: object
  TransferredWorkspace:
    properties:
      alias:
        type: string
      id:
        type: string
      name:
        type: string
      personal:
        type: boolean
    type: object
  User:
    properties:
      alias:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  UserDetail:
    properties:
      alias:
        type: string
      email:
        type: string
      host:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  UserWorkspace:
    properties:
      alias:
        type: string
      id:
        type: string
      name:
        type: string
      personal:
        type: boolean
      role:
        type: string
    type: object
  Workspace:
    properties:
      alias:
        type: string
      id:
        type: string
      memberCount:
        type: integer
      name:
        type: string
      personal:
        type: boolean
      updatedAt:
        type: string
    type: object
  WorkspaceMember:
    properties:
      disabled:
        type: boolean
      email:
        description: empty string if the member's user cannot be resolved
        type: string
      name:
        description: empty string if the member's user cannot be resolved
        type: string
      role:
        type: string
      userId:
        type: string
    type: object
  scimStateResponse:
    properties:
      scim_enabled:
        type: boolean
    type: object
  setScimAvailableRequest:
    properties:
      enabled:
        type: boolean
    type: object
info:
  contact: {}
  description: Admin REST API for the internal management console.
  title: Re:Earth Accounts Admin API
  version: "1.0"
paths:
  /admin-users:
    get:
      description: Lists admin users in creation order, optionally filtered by status
        and/or role, with offset pagination.
      parameters:
      - description: Filter by status
        enum:
        - pending
        - approved
        - rejected
        in: query
        name: status
        type: string
      - description: Filter by role
        enum:
        - system_admin
        - viewer
        in: query
        name: role
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminUsersResponse'
        "400":
          description: invalid query
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List admin users
      tags:
      - admin-users
  /admin-users/{id}/approve:
    post:
      description: Approves a pending or rejected admin user, recording the current
        admin as approver. Idempotent for already-approved users (the original approver/timestamp
        is kept). Cannot approve your own account.
      parameters:
      - description: Admin user ID
        in: path
        name: id
        required: true
        type: string
      - description: admin_csrf cookie value
        in: header
        name: X-Csrf-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminUser'
        "400":
          description: invalid id / cannot modify self
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved / missing or invalid csrf token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Approve an admin user
      tags:
      - admin-users
  /admin-users/{id}/reject:
    post:
      description: Rejects a pending admin user or revokes an approved one. Cannot
        reject your own account, and the last approved admin cannot be rejected.
      parameters:
      - description: Admin user ID
        in: path
        name: id
        required: true
        type: string
      - description: admin_csrf cookie value
        in: header
        name: X-Csrf-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminUser'
        "400":
          description: invalid id / cannot modify self / last approved admin
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved / missing or invalid csrf token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Reject or revoke an admin user
      tags:
      - admin-users
  /admin-users/{id}/roles:
    put:
      consumes:
      - application/json
      description: Assigns a role (e.g. system_admin, viewer) to the target admin
        user. Changing your own role is allowed, but the last system_admin cannot
        be demoted (the system must never reach zero system_admins).
      parameters:
      - description: Admin user ID
        in: path
        name: id
        required: true
        type: string
      - description: admin_csrf cookie value
        in: header
        name: X-Csrf-Token
        required: true
        type: string
      - description: Role to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SetAdminUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminUser'
        "400":
          description: invalid id / invalid role / cannot demote the last system admin
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved / missing or invalid csrf token / forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Assign a role to an admin user
      tags:
      - admin-users
  /auth/google:
    post:
      consumes:
      - application/json
      description: Verifies the Google id_token and issues an HttpOnly admin session
        cookie plus a readable (non-HttpOnly) admin_csrf double-submit cookie. New
        accounts are created as pending (approved when the email is bootstrapped).
      parameters:
      - description: Google id_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/GoogleSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GoogleSignInResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: id_token verification failed
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: domain not allowed / email not verified
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign in with a Google id_token
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Clears the admin session cookie and the admin_csrf double-submit
        cookie. Public endpoint so the cookies can be cleared even with an expired/invalid
        token. When an admin_csrf cookie is sent, the X-Csrf-Token header must match
        it. This only rejects forged same-site requests: a cross-site request arrives
        without the SameSite=Lax admin_csrf cookie and is not CSRF-checked.'
      parameters:
      - description: admin_csrf cookie value; required when that cookie is sent
        in: header
        name: X-Csrf-Token
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: missing or invalid csrf token
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Log out
      tags:
      - auth
  /me:
    get:
      description: Returns the admin user record for the session cookie (any status).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MeResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: account not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get the current admin user
      tags:
      - auth
  /policies/{type}/notices:
    get:
      description: Returns each notice recorded for the upcoming version of the policy
        type, with the number of its mail records in each outbox state. The list is
        empty when the type has no upcoming version. While the accounts server has
        no mail provider, records stay pending.
      parameters:
      - description: Policy type
        example: tos
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListPolicyNoticesResponse'
        "400":
          description: invalid type
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved / forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List the notices of a policy's upcoming version
      tags:
      - policies
    post:
      consumes:
      - application/json
      description: 'Records a notice for the upcoming version of the policy type.
        The accounts server then queues one mail per user of the audience and sends
        it: "all" is every active user with an email address, "owners" is the owners
        of non-personal workspaces. A major notice skips users who already accepted
        the version. Each user gets at most one mail per version, so repeating the
        request queues nothing new and returns the recorded notice with 200. The admin
        API sends no mail itself.'
      parameters:
      - description: Policy type
        example: tos
        in: path
        name: type
        required: true
        type: string
      - description: Audience
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreatePolicyNoticeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: already recorded
          schema:
            $ref: '#/definitions/CreatePolicyNoticeResponse'
        "201":
          description: recorded
          schema:
            $ref: '#/definitions/CreatePolicyNoticeResponse'
        "400":
          description: invalid type / invalid request body / invalid audience
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved / forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: no_upcoming_version / not_required / patch_version
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Record a notice for a policy's upcoming version
      tags:
      - policies
  /users:
    get:
      description: Lists users, optionally filtered by a name/alias/email keyword,
        with offset pagination.
      parameters:
      - description: Search by name, alias or email
        in: query
        name: q
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListUsersResponse'
        "400":
          description: invalid query
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List users
      tags:
      - users
  /users/{id}:
    get:
      description: Returns the detail of a single user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserDetail'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get a user
      tags:
      - users
  /users/{id}/workspaces:
    get:
      description: Returns the workspaces the user belongs to, with the user's role
        in each. An existing user in no workspace returns an empty list; a non-existent
        user returns 404.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/UserWorkspace'
            type: array
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List a user's workspaces
      tags:
      - users
  /workspaces:
    get:
      description: |-
        Lists workspaces across all tenants, optionally filtered by a name/alias keyword, with offset pagination.
        Use `type` to filter by workspace type: `personal` returns only personal workspaces, `team` returns only team (non-personal) workspaces; when absent, both types are returned.
        When one or more `ids` query parameters are supplied, the endpoint instead resolves those workspaces by ID (existing ones only; unknown IDs are omitted) and ignores `q`, `type`, `page` and `per_page`. At most 100 ids may be supplied per request.
      parameters:
      - collectionFormat: multi
        description: Batch fetch by workspace ID (repeatable, max 100). When present,
          q/type/page/per_page are ignored.
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: Search by name or alias
        in: query
        name: q
        type: string
      - description: Filter by workspace type
        enum:
        - personal
        - team
        in: query
        name: type
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListWorkspacesResponse'
        "400":
          description: invalid query
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
        "501":
          description: not implemented on this backend
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List workspaces
      tags:
      - workspaces
  /workspaces/{id}:
    get:
      description: Returns the detail of a single workspace by ID.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Workspace'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get a workspace
      tags:
      - workspaces
  /workspaces/{id}/members:
    get:
      description: Returns the members of a workspace, each with their role and (when
        resolvable) the underlying user's name and email.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/WorkspaceMember'
            type: array
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List a workspace's members
      tags:
      - workspaces
  /workspaces/{id}/scim:
    get:
      description: 'Returns whether the admin has enabled SCIM provisioning for the
        workspace (scim_available: true means a ScimConfig exists).'
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scimStateResponse'
        "400":
          description: invalid workspace id
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved or forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get SCIM availability for a workspace
      tags:
      - workspaces
    patch:
      consumes:
      - application/json
      description: When enabled is true and no ScimConfig exists, a blank one is created.
        When enabled is false, the ScimConfig (and the SCIM token) is removed.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: enabled flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/setScimAvailableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scimStateResponse'
        "400":
          description: invalid workspace id or request body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved or forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Enable or disable SCIM for a workspace
      tags:
      - workspaces
  /workspaces/{id}/transfer-owner:
    post:
      consumes:
      - application/json
      description: Makes an existing, enabled member of a team workspace its sole
        owner. Every other owner becomes a maintainer. A reader may be made owner.
        A soft-deleted workspace is treated as not found. On PostgreSQL, and on MongoDB
        with transactions enabled, the role and permittable changes are committed
        in one transaction and concurrent changes to the same workspace are serialized
        (PostgreSQL) or rejected with 409 conflict (MongoDB). On MongoDB without transaction
        support the changes are applied one by one, and a failure part-way can leave
        them partially applied.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: New owner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/TransferWorkspaceOwnerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TransferWorkspaceOwnerResponse'
        "400":
          description: invalid id / invalid request body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: not approved / forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: already_owner (with newOwner) / conflict (concurrent change,
            retry)
          schema:
            $ref: '#/definitions/TransferWorkspaceOwnerConflictResponse'
        "422":
          description: personal_workspace / target_not_member / target_disabled /
            target_user_not_found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Transfer a workspace's ownership
      tags:
      - workspaces
securityDefinitions:
  BearerAuth:
