services:
  reearth-cerbos:
    image: cerbos/cerbos:0.40.0
    command: server --config=/policies/.cerbos.yaml
    ports:
      - 3593:3593
    volumes:
      - ./server/e2e/testdata/policies:/policies
    networks:
      - reearth

  # Optional PostgreSQL backend (opt-in). Point the app at it with
  # REEARTH_ACCOUNTS_DB=postgres://reearth:reearth@postgres:5432/reearth-account?sslmode=disable
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reearth
      POSTGRES_PASSWORD: reearth
      POSTGRES_DB: reearth-account
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - reearth

  # Local token issuer for service callers (ADR-0002 decision 11). Start it with
  # `docker compose -f docker-compose.dev.yml up -d mock-oauth2`, then run
  # `make dev-seed` in server/. See docs/service-callers.md, "Local development".
  # The host port equals the container port so that one issuer URL,
  # http://mock-oauth2:8091/accounts-local, works inside and outside compose.
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1@sha256:eb07a0a65007c34c40c7b849592a47e6299128a514a5c6c582a53451cc6e3390
    environment:
      SERVER_PORT: "8091"
      JSON_CONFIG_PATH: /config/config.json
    ports:
      - 127.0.0.1:8091:8091
    volumes:
      - ./server/dev/mock-oauth2:/config:ro
    networks:
      - reearth

  reearth-accounts-dev:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file:
      - ./server/.env.docker
      # Written by `make dev-seed`; absent until then.
      - path: ./server/.dev/service-callers/accounts.env
        required: false
    ports:
      - 8090:8090
    depends_on:
      - reearth-cerbos
    volumes:
      - ./server:/reearth-accounts  # Mount source code for hot reload
      - /reearth-accounts/tmp       # Exclude tmp directory
    networks:
      - reearth

volumes:
  postgres-data:

networks:
  reearth:
    external: true
